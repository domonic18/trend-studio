name: CI/CD

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 仓库为 public：主机、部署路径走仓库变量，密钥与仓库命名空间走 secret，
  # YAML 里只留公有常量（registry 域名、镜像仓库名）。
  # 维护方式与 ai-invest 一致：变量=非密配置，secret=凭据。
  TCR_REGISTRY: ccr.ccs.tencentyun.com
  TCR_NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
  IMAGE_NAME: trend-cloud

jobs:
  # ---------------------------------------------------------------- 静态检查
  check:
    name: Check / 类型检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install / 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Check / 类型检查（三包 + 管理台 + 门户）
        run: pnpm check

  # ---------------------------------------------------------------- 测试
  test:
    name: Test / 单元与契约测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # 必须与生产同款：检索依赖 pgvector 扩展与 pg_trgm
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: trend_coach
          POSTGRES_PASSWORD: trend_coach
          POSTGRES_DB: trend_coach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trend_coach -d trend_coach"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # 两个库必须不同：测试会重放迁移并清空目标库，指向同一个库会抹掉开发数据
      # （scripts/verify-test-db.mjs 会再校验一次，指错直接拒绝跑）
      DATABASE_URL: postgres://trend_coach:trend_coach@127.0.0.1:5432/trend_coach
      TEST_DATABASE_URL: postgres://trend_coach:trend_coach@127.0.0.1:5432/trend_coach_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install / 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Create test database / 建测试库
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U trend_coach -d postgres -c "CREATE DATABASE trend_coach_test OWNER trend_coach"

      # coach 的 pretest 要用 ffmpeg 现场转出加密 HLS 夹具；runner 镜像不带
      # ffmpeg，缺了会静默失败在夹具构建上，报错还看不出缺的是什么。
      - name: Install ffmpeg / 安装 ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Test / 跑全仓测试
        run: pnpm test

  # ---------------------------------------------------------------- 镜像构建
  build:
    name: Build / 构建镜像
    # 境内自托管 runner 构建并推 TCR。
    # ubuntu-latest 的跨境推送链路是边缘可用：2026-11-08 实测两次
    # `pushing layers` 无进展、各撞 18 分钟步骤上限（另一次挂起 28 分钟），
    # 成功的一次也要 948 秒——生产发布完全押在这条链路上，一半失败不可接受。
    # 同机自托管 runner 推 TCR 实测 35 秒~5 分 51 秒，且 buildx 缓存常驻可复用。
    runs-on: [self-hosted]
    # 仓库是 public：PR（含 fork）绝不在自托管机上执行仓库代码。
    # 自托管 runner 持有 docker 与部署目录权限，让外部 PR 的代码在上面跑，
    # 等于把构建机开放出去。镜像构建只在主干 push 上跑——develop 的 push
    # 同样会构建，Dockerfile 写坏了在进 main 之前就会暴露。
    # workflow_dispatch 例外：手动触发是发布前的演练入口，只有有写权限的人
    # 能触发（ai-invest 同一口径）。
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    # 预算 = 构建 20 + 推送 30 + 收尾；推送那 30 分钟是看门狗的三个 10 分钟
    # 上限（挂死的推送不会一直占着预算，重试因此有机会执行）。
    timeout-minutes: 60
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4

      # 常驻 buildx 构建器：buildkitd 配了国内 docker.io 镜像源（Docker Hub
      # 直连拉不到 node:22-alpine），且构建缓存跨 job 持久，失败重跑秒级复用。
      # 不用 setup-buildx-action——它会另建临时 builder 顶掉选择，
      # 临时 builder 没有镜像源配置，基础镜像直接拉不动。
      - name: Select builder / 选择构建器
        run: docker buildx use ci-builder

      # 镜像仓库路径由仓库变量拼装；变量缺失就明确失败，
      # 不推到一个写死在 YAML 里的命名空间（推错仓库等于把坏镜像发到线上）。
      - name: Preconditions / 前置校验
        run: |
          set -eu
          [ -n "${{ env.TCR_NAMESPACE }}" ] || { echo "ERROR: 未配置仓库 secret TCR_NAMESPACE" >&2; exit 1; }
          echo "镜像目标：${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}"

      - name: Resolve tag / 解析镜像标签（<branch>-<sha7>，不可变）
        id: vars
        run: |
          sha_short="$(git rev-parse --short=7 "$GITHUB_SHA")"
          case "$GITHUB_REF" in
            refs/heads/main)    tag="main-${sha_short}" ;;
            refs/heads/develop) tag="develop-${sha_short}" ;;
            # 手动触发（发布前演练）可以落在任意分支上，按分支名打 tag
            *)                 tag="$(basename "$GITHUB_REF" | tr '/' '-')-${sha_short}" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$TCR_REGISTRY/$TCR_NAMESPACE/$IMAGE_NAME:$tag" >> "$GITHUB_OUTPUT"

      # id 供重试条件用：登录失败属配置错误，不进重试（避免白建镜像且盖住真错）
      - name: Login TCR / 登录镜像仓库
        id: login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      # 只构建不入库：load 进本地 docker，构建缓存留在构建机上，
      # 推送交给后面的独立步骤——挂死时只需重推，不必重建。
      # --provenance=false：TCR 不认 OCI attestation 附加清单
      - name: Build / 本地构建镜像
        id: build
        timeout-minutes: 20
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
        run: |
          set -euo pipefail
          docker buildx build --builder ci-builder --platform linux/amd64 \
            --file apps/cloud/Dockerfile --load --provenance=false \
            --tag "$IMAGE" .

      # 每次推送自带看门狗：docker push 走跨境链路，卡住时不会自己返回，
      # 也不认超时参数；runner 是 macOS（BSD userland），没有 GNU coreutils 的
      # timeout，故用「后台进程 + 轮询 ps 状态」实现单次尝试的 600 秒上限：
      # 超时就杀掉本次、进入下一次重试。
      # 没有这个上限，重试就是摆设——单次挂死即吃光整轮预算。
      - name: Push to TCR / 推送镜像
        id: push
        continue-on-error: true
        timeout-minutes: 35
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          PUSH_ATTEMPTS: 3
          # 单次推送的看门狗上限（秒）。超过即判定本次挂死，杀掉后重试。
          PUSH_DEADLINE_S: 600
        run: |
          set -euo pipefail

          # 单次推送 + 看门狗。
          # docker push 卡住时不会自己返回，也不认超时参数。
          # runner 是 macOS（BSD userland），没有 GNU coreutils 的 timeout，
          # 故用「后台进程 + 轮询 ps 状态」实现，不引入额外依赖。
          push_once() {
            local image="$1" limit_s="$2" pid waited=0 stat
            docker push "$image" &
            pid=$!
            while :; do
              # 空 = 进程已不存在；Z = 僵尸（已退出待回收）——都算已结束
              stat="$(ps -o stat= -p "$pid" 2>/dev/null || true)"
              case "$stat" in
                ""|Z*) break ;;
              esac
              if [ "$waited" -ge "$limit_s" ]; then
                echo "[push] 单次推送超过 ${limit_s}s 仍无进展，终止本次尝试" >&2
                kill -TERM "$pid" 2>/dev/null || true
                sleep 2
                kill -KILL "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                return 124
              fi
              sleep 5
              waited=$((waited + 5))
            done
            wait "$pid"
          }

          attempt=1
          while [ "$attempt" -le "$PUSH_ATTEMPTS" ]; do
            echo "[push] 第 $attempt/$PUSH_ATTEMPTS 次：$IMAGE"
            if push_once "$IMAGE" "$PUSH_DEADLINE_S"; then
              exit 0
            fi
            echo "[push] 第 $attempt 次失败" >&2
            attempt=$((attempt + 1))
            # 不用 `[ ... ] && sleep`：条件为假时整个 && 复合命令返回 1，
            # set -e 下会把循环体当失败直接终止（最后一轮必踩）
            if [ "$attempt" -le "$PUSH_ATTEMPTS" ]; then
              sleep 10
            fi
          done
          echo "[push] $PUSH_ATTEMPTS 次全部失败" >&2
          exit 1

      - name: Conclude build outcome / 构建推送结论裁定
        if: always()
        # 裁定顺序 = 登录 → 构建 → 推送：前一步失败时后一步的 outcome 是 skipped，
        # 不按顺序判就会把「登录失败」报成「构建失败」，把真错盖住
        # 镜像地址经 env 传入：直接插值含 namespace secret，日志里会被 GitHub 掩成 ***
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
        run: |
          if [ "${{ steps.login.outcome }}" != "success" ]; then
            echo "[FAIL] 镜像仓库登录失败（配置问题，重试无意义）" >&2
            exit 1
          fi
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "[FAIL] 镜像构建失败" >&2
            exit 1
          fi
          if [ "${{ steps.push.outcome }}" = "success" ]; then
            echo "[OK] 镜像推送成功：$IMAGE"
          else
            echo "[FAIL] 镜像推送失败（重试耗尽）" >&2
            exit 1
          fi

  # ---------------------------------------------------------------- 发布制品
  artifacts:
    name: Artifacts / 打包插件制品
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install / 安装依赖
        run: pnpm install --frozen-lockfile

      # 学员端与教员生产端两个插件都要打包：官网下载区与发布清单是同一份真相，
      # 制品本身不进 git（*.tgz 被忽略），只能由流水线现打。
      # npm pack 不是逐字节可复现的——同一份源码两次打包 sha256 不同，且插件里
      # bundle 了 @trend/contracts 与 @trend/widgets（它们随本次 commit 变）。
      # 所以清单里的校验值必须跟着这次打包的结果重算，不能沿用仓库里那份。
      - name: Pack / 打包双插件并回写发布清单
        run: |
          node apps/cloud/scripts/publish-plugin.mjs --plugin coach
          node apps/cloud/scripts/publish-plugin.mjs --plugin producer

      # 清单与制品必须成对下发：清单里的 sha256 只对得上同一次打包的 tarball。
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            apps/cloud/dist/downloads
            apps/cloud/content/releases.json
          if-no-files-found: error

  # ---------------------------------------------------------------- 生产发布
  deploy-production:
    name: Deploy Production / 生产环境发布
    runs-on: ubuntu-latest
    needs: [build, artifacts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 60
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # 主机与部署目录走仓库变量（非密配置，与 ai-invest 同一维护方式）
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

    steps:
      - uses: actions/checkout@v4

      # 插件制品与发布清单由 artifacts job 打包产出；两者必须成对取回——
      # 清单里的 sha256 只对得上同一次打包的 tarball。
      - name: Download release artifacts / 取回插件制品与发布清单
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: apps/cloud

      # 主机与路径走仓库变量、密钥走 secret，缺任何一项都明确失败，
      # 不带着半套配置继续发布（否则 ssh 会用空 host 报一堆看不懂的错）
      - name: Preconditions / 前置校验
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          [ -n "$DEPLOY_HOST" ] || { echo "ERROR: 未配置仓库变量 DEPLOY_HOST" >&2; exit 1; }
          [ -n "$DEPLOY_PATH" ] || { echo "ERROR: 未配置仓库变量 DEPLOY_PATH" >&2; exit 1; }
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "ERROR: 未配置仓库 secret DEPLOY_SSH_KEY" >&2; exit 1; }
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "ERROR: 未配置仓库 secret DEPLOY_KNOWN_HOSTS" >&2; exit 1; }
          [ -n "${{ env.TCR_NAMESPACE }}" ] || { echo "ERROR: 未配置仓库 secret TCR_NAMESPACE" >&2; exit 1; }

      - name: Setup SSH key / 配置免密密钥与主机指纹
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve tag / 解析镜像标签
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Snapshot server state / 记录发布前现场
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && echo '--- 状态文件 ---' && cat .deploy-state 2>/dev/null; echo '--- 当前 IMAGE_TAG ---' && grep -E '^IMAGE_TAG=' .env.prod 2>/dev/null; echo '--- 当前容器 ---' && sudo docker compose --env-file .env.prod -f docker-compose.prod.yml ps --format '{{.Service}} {{.Image}} {{.State}}' 2>/dev/null"

      - name: Sync deploy assets / 同步部署资产到服务器
        # 生产机到 GitHub 的链路不稳，发布资产一律由 CI 直传（与 git checkout 等价，同一 commit）。
        # 送什么：部署脚本、compose、Caddy 配置、备份脚本——外加**发布分发件**：
        # content/（发布清单 + 教员装机脚本）与 dist/downloads/（插件 tarball）。
        # 这两处是 compose 挂进容器的宿主目录，不同步过去，教员装不上、学员下不到插件，
        # 服务却照常跑——产品是残的。
        # 迁移文件不进资产包——迁移随应用镜像走，线上执行的迁移必然与本次发布的代码同 commit。
        run: |
          set -eu
          cd apps/cloud
          COPYFILE_DISABLE=1 tar -czf /tmp/deploy-assets.tar.gz \
            deploy/deploy.sh \
            deploy/caddy/Caddyfile \
            scripts/backup.sh \
            docker-compose.prod.yml \
            content \
            dist/downloads
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            /tmp/deploy-assets.tar.gz "$DEPLOY_HOST:/tmp/deploy-assets.tar.gz"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_HOST" \
            sudo bash -s -- "$DEPLOY_PATH" "$GITHUB_SHA" <<'REMOTE'
          set -eu
          cd "$1"
          # 下载区只留本次发布的制品：清单每次发布被覆盖，旧 tarball 没人引用，
          # 留着只涨磁盘。先清后解——反了就把自己刚发的也删了。
          rm -f dist/downloads/*.tgz
          # --no-same-owner：不让归档里的 uid/gid 覆盖服务器属主
          tar --no-same-owner -xzf /tmp/deploy-assets.tar.gz
          rm -f /tmp/deploy-assets.tar.gz
          chmod 755 deploy/deploy.sh scripts/backup.sh
          printf '%s\n' "$2" > .deploy-commit
          # 资产落地完整性校验：缺任何一项都中止，不带着半套资产继续发布
          for f in deploy/deploy.sh deploy/caddy/Caddyfile scripts/backup.sh docker-compose.prod.yml \
                   content/releases.json content/install-producer.sh; do
              [ -f "$f" ] || { echo "ERROR: 资产缺失：$f" >&2; exit 1; }
          done
          # 清单点名的制品必须都在下载区：教员/学员下载的是清单里的那个文件名
          for a in $(grep -oE '[A-Za-z0-9@._-]+\.tgz' content/releases.json | sort -u); do
              [ -f "dist/downloads/$a" ] || { echo "ERROR: 制品缺失：dist/downloads/$a" >&2; exit 1; }
          done
          # 运行期目录：数据都在 workspace/ 下（compose 挂载点）
          mkdir -p workspace/postgres workspace/pipeline workspace/caddy/data workspace/caddy/config \
                   workspace/media workspace/backups dist/downloads content
          # app 容器以 node（uid 1000）写入管线与媒体目录
          chown -R 1000:1000 workspace/pipeline workspace/media dist/downloads
          echo "--- 已同步：发布资产齐全 ---"
          REMOTE

      - name: Deploy / 发布（备份 → 迁移先行 → 换容器 → 健康检查 → 失败自动回滚）
        # --image-repo 与 build job 的推送目标同源（同一组 env），
        # 服务器拉的仓库与 CI 推的仓库严格一致，不会因 namespace 变更而拉空
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && sudo bash deploy/deploy.sh --env prod --tag 'main-${{ steps.vars.outputs.sha_short }}' --image-repo '${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}'"

      - name: Verify / 核对发布结果
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && echo '--- 状态文件 ---' && cat .deploy-state && echo '--- 容器 ---' && sudo docker compose --env-file .env.prod -f docker-compose.prod.yml ps --format '{{.Service}} {{.Image}} {{.State}}'"
