# 用法见 docs/operations/deployment-runbook.md：
#   本机 staging：docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#   生产发布：CI 推镜像到 TCR，服务器只 pull；入口是 deploy/deploy.sh，不要手工 compose up。
# 不内置监控服务；/metrics 保留，接入外部 Prometheus 时参考 deploy/monitoring/。
name: trend-coach

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?在 .env.prod 设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?在 .env.prod 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?在 .env.prod 设置 POSTGRES_DB}
    volumes:
      - ./workspace/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  app:
    build:
      # 构建上下文是 monorepo 根目录（pnpm workspace），见 apps/cloud/Dockerfile。
      # 生产发布不走这条路：镜像由 CI 构建并推 TCR，服务器只 pull（deploy.sh 带 --no-build）。
      context: ../..
      dockerfile: apps/cloud/Dockerfile
    image: ${TREND_IMAGE_REPO:-ccr.ccs.tencentyun.com/domonic18/trend-cloud}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      HOST: 0.0.0.0
      PORT: "3939"
      # 密码含特殊字符时需先 URL 编码。
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # 迁移由独立 migrate 步骤执行（发布前先行），应用不再启动即迁移。
      MIGRATE_ON_START: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 仅本地 staging 验证需要；生产媒体走对象存储。本地 staging 的
      # PIPELINE_HLS_DIR=/media，故以可写方式挂载。
      - ${MEDIA_HOST_DIR:-./workspace/media}:/media
      # 管线工作区与 HLS 输出必须在同一挂载点内，HLS 才能原子 rename。
      - ./workspace/pipeline:/data
      # 下载制品与发布清单挂宿主目录：发布脚本写宿主这份，容器即刻能下、
      # 清单即刻生效，不必重建镜像也不必重启服务（清单每次请求现读）。
      - ./dist/downloads:/app/apps/cloud/dist/downloads
      - ./content:/app/apps/cloud/content
    networks: [edge, backend]

  # 迁移是一次性动作，不常驻：profile 让 compose up 不启动它，
  # 发布时用 `docker compose run --rm --no-deps --pull never -T migrate` 触发。
  # 与应用同一个镜像——迁移文件随镜像版本化，线上执行的迁移必然与本次发布的代码同 commit。
  migrate:
    image: ${TREND_IMAGE_REPO:-ccr.ccs.tencentyun.com/domonic18/trend-cloud}:${IMAGE_TAG:-latest}
    profiles: [migrate]
    command: ["node", "dist/server/migrate-cli.js"]
    restart: "no"
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?在 .env.prod 设置 DOMAIN}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./workspace/caddy/data:/data
      - ./workspace/caddy/config:/config
    networks: [edge]

networks:
  edge:
  backend:

# 持久化数据统一由 ./workspace 承接（postgres / pipeline / caddy），不使用命名卷。
