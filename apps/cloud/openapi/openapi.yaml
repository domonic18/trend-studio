openapi: 3.1.0
info:
  title: 趋势课程云端服务
  version: 0.2.0
  description: |
    仅供 dsh-plugin-trend-coach 使用。学员业务接口只读知识内容（进度与事件同意除外），凭据只出现在插件 Host 侧。
    接口口径以 docs/architecture/cloud-service-integration-checklist.md 为准。
servers:
  - url: http://127.0.0.1:3939

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    deviceId:
      type: apiKey
      in: header
      name: x-device-id
    sessionAuth:
      type: http
      scheme: bearer
      description: 后台会话令牌（仅 operator/admin），与设备 accessToken 分离。
    uploadTicketAuth:
      type: apiKey
      in: query
      name: sig
      description: 直传签名凭据（expires/size/sig 查询参数 + x-file-sha256 头），与后台会话二选一。

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        requestId:
          type: string

    Segment:
      type: object
      additionalProperties: false
      required:
        [segmentId, courseId, chapterId, knowledgePointId, title, startSec, endSec, text, score]
      properties:
        segmentId:
          type: string
          pattern: '^seg-[A-Za-z0-9._-]+$'
          maxLength: 80
        courseId:
          type: string
        chapterId:
          type: string
        knowledgePointId:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        courseTitle:
          type: string
          maxLength: 200
        chapterTitle:
          type: string
          maxLength: 200
        knowledgePointTitle:
          type: string
          maxLength: 200
        startSec:
          type: integer
          minimum: 0
        endSec:
          type: integer
        text:
          type: string
          minLength: 1
          maxLength: 4000
        score:
          type: number
          minimum: 0
          maximum: 1

    RelatedKnowledgePoint:
      type: object
      additionalProperties: false
      required: [knowledgePointId, title]
      properties:
        knowledgePointId:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200

    SearchResponse:
      type: object
      additionalProperties: false
      required: [segments, relatedKnowledgePoints]
      properties:
        segments:
          type: array
          items:
            $ref: '#/components/schemas/Segment'
        relatedKnowledgePoints:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/RelatedKnowledgePoint'

    Grant:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, expiresAt, deviceId]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: integer
          description: 毫秒时间戳
        deviceId:
          type: string

    DeviceCodeStart:
      type: object
      additionalProperties: false
      required: [deviceCode, userCode, verificationUri, expiresIn, interval]
      properties:
        deviceCode:
          type: string
        userCode:
          type: string
        verificationUri:
          type: string
          format: uri
        expiresIn:
          type: integer
          description: 秒
        interval:
          type: integer
          description: 轮询间隔，秒

    DeviceTokenResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              const: pending
        - type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              const: expired
        - type: object
          additionalProperties: false
          required: [status, grant]
          properties:
            status:
              const: authorized
            grant:
              $ref: '#/components/schemas/Grant'

    PlaybackSession:
      type: object
      additionalProperties: false
      required: [sessionId, playlistUrl, expiresAt, watermark]
      properties:
        sessionId:
          type: string
        playlistUrl:
          type: string
          format: uri
        expiresAt:
          type: integer
          description: 毫秒时间戳，至少覆盖 60s 播放窗口
        watermark:
          type: object
          additionalProperties: false
          required: [label]
          properties:
            label:
              type: string

    AssetPlaybackSessionResponse:
      type: object
      additionalProperties: false
      required: [sessionId, playlistUrl, fromSec, toSec, expiresAt]
      properties:
        sessionId:
          type: string
        playlistUrl:
          type: string
          format: uri
        fromSec:
          type: integer
          nullable: true
          description: 片段窗起秒；未提供窗口时为 null（全片）
        toSec:
          type: integer
          nullable: true
        expiresAt:
          type: integer
          description: 毫秒时间戳

    EventsConsent:
      type: object
      additionalProperties: false
      required: [consent]
      properties:
        consent:
          type: boolean

    EventRequest:
      type: object
      additionalProperties: false
      required: [eventId, name, props]
      properties:
        eventId:
          type: string
          pattern: '^[A-Za-z0-9._:-]{8,64}$'
        name:
          type: string
          enum: [search_requested, citation_clicked, player_started]
        occurredAt:
          type: integer
          description: 毫秒时间戳；缺省为服务端接收时间
        props:
          type: object
          description: |
            字段白名单随 name 变化，不接受其它字段：
            search_requested = durationMs/topK/hits/empty；
            citation_clicked = segmentId；
            player_started = startupMs/autoplayBlocked。

    CatalogCourseSummary:
      type: object
      additionalProperties: false
      required: [courseId, title, chapterCount, knowledgePointCount, completedCount]
      properties:
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        chapterCount:
          type: integer
          minimum: 0
        knowledgePointCount:
          type: integer
          minimum: 0
        completedCount:
          type: integer
          minimum: 0

    CatalogCourseList:
      type: object
      additionalProperties: false
      required: [courses]
      properties:
        courses:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CatalogCourseSummary'

    CatalogKnowledgePoint:
      type: object
      additionalProperties: false
      required: [knowledgePointId, title, position, watchedSec, completed]
      properties:
        knowledgePointId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
        segmentId:
          type: string
          pattern: '^seg-[A-Za-z0-9._-]+$'
          maxLength: 80
        watchedSec:
          type: integer
          minimum: 0
          maximum: 86400
        completed:
          type: boolean

    CatalogChapter:
      type: object
      additionalProperties: false
      required: [chapterId, title, position, hasArticle, figureCount, knowledgePoints]
      properties:
        chapterId:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
        hasArticle:
          type: boolean
        figureCount:
          type: integer
          minimum: 0
          maximum: 3
        knowledgePoints:
          type: array
          items:
            $ref: '#/components/schemas/CatalogKnowledgePoint'

    CatalogCourse:
      type: object
      additionalProperties: false
      required: [contractVersion, courseId, title, chapters]
      properties:
        contractVersion:
          type: integer
          minimum: 1
          description: 2=章级目录；3=节级学习契约（课程存在已发布节正文时附带 sections）。
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        chapters:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/CatalogChapter'
        sections:
          type: array
          description: v3 才有；v2 老课程不返回此字段。
          maxItems: 200
          items:
            $ref: '#/components/schemas/CatalogSectionSummary'

    CatalogSectionSummary:
      type: object
      additionalProperties: false
      required: [sectionId, title, position, hasArticle, figureCount, widgetTypes, caseStockCodes]
      properties:
        sectionId:
          type: string
          pattern: '^sec_[0-9a-f]{16}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          minimum: 0
        hasArticle:
          type: boolean
        figureCount:
          type: integer
          minimum: 0
          maximum: 20
        widgetTypes:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 32
        caseStockCodes:
          type: array
          items:
            type: string
            pattern: '^[0-9]{6}$'

    CatalogSection:
      type: object
      additionalProperties: false
      required: [sectionId, courseId, chapterId, title, position, article, widgets, figures, caseStocks]
      properties:
        sectionId:
          type: string
          pattern: '^sec_[0-9a-f]{16}$'
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        chapterId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        position:
          type: integer
          minimum: 0
        article:
          oneOf:
            - $ref: '#/components/schemas/CatalogSectionArticle'
            - type: 'null'
        widgets:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CatalogWidget'
        figures:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CatalogFigure'
        caseStocks:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CatalogCaseStock'

    CatalogSectionArticle:
      type: object
      additionalProperties: false
      required: [markdown, dslVersion, version, publishedAt]
      properties:
        markdown:
          type: string
          minLength: 1
          maxLength: 20000
        dslVersion:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 0
        publishedAt:
          type: integer
          description: 毫秒时间戳

    CatalogWidget:
      type: object
      additionalProperties: false
      required: [widgetId, type, specVersion, version, spec, assertions]
      properties:
        widgetId:
          type: string
          minLength: 1
          maxLength: 64
        type:
          type: string
          minLength: 1
          maxLength: 32
        specVersion:
          type: integer
          minimum: 0
        version:
          type: integer
          minimum: 0
        spec:
          type: object
          additionalProperties: true
        assertions:
          type: object
          additionalProperties: true

    CatalogFigure:
      type: object
      additionalProperties: false
      required: [figureId, kind, caption, assetId, sourceSec, candidateId, url]
      properties:
        figureId:
          type: string
          minLength: 1
          maxLength: 64
        kind:
          type: string
          minLength: 1
          maxLength: 16
        caption:
          type: string
          minLength: 1
          maxLength: 200
        assetId:
          type: string
          nullable: true
        sourceSec:
          type: integer
          nullable: true
        candidateId:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
          description: 短时签名图片地址；未选定候选时为 null。

    CatalogCaseStock:
      type: object
      additionalProperties: false
      required: [code, name, exchange, windowStart, windowEnd, events]
      properties:
        code:
          type: string
          pattern: '^[0-9]{6}$'
        name:
          type: string
          minLength: 1
          maxLength: 50
        exchange:
          type: string
          enum: [SZSE, SSE, BSE]
        windowStart:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        windowEnd:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        events:
          type: array
          items:
            type: object
            additionalProperties: true

    CatalogPlayback:
      type: object
      additionalProperties: false
      required: [sessionId, playlistUrl, fromSec, toSec, expiresAt]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 64
        playlistUrl:
          type: string
          minLength: 1
        fromSec:
          type: integer
          nullable: true
        toSec:
          type: integer
          nullable: true
        expiresAt:
          type: integer
          description: 毫秒时间戳

    ChapterArticle:
      type: object
      additionalProperties: false
      required: [markdown, version, publishedAt]
      properties:
        markdown:
          type: string
          minLength: 1
          maxLength: 20000
          description: 仅 Markdown 子集；图片引用只允许 ![alt](figure:figureId)。
        version:
          type: integer
          minimum: 1
        publishedAt:
          type: integer
          description: 毫秒时间戳

    ChapterFigure:
      type: object
      additionalProperties: false
      required: [url, width, height, alt]
      properties:
        url:
          type: string
          description: 短时签名地址，默认 10 分钟；过期后重新请求本章。
        width:
          type: integer
          minimum: 800
        height:
          type: integer
          minimum: 800
        alt:
          type: string
          minLength: 1
          maxLength: 200
        caption:
          type: string
          minLength: 1
          maxLength: 200

    CatalogChapterArticle:
      type: object
      additionalProperties: false
      required: [chapterId, courseId, title, article, figures, adjacentChapters, quiz]
      properties:
        chapterId:
          type: string
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        article:
          oneOf:
            - $ref: '#/components/schemas/ChapterArticle'
            - type: 'null'
        figures:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ChapterFigure'
        adjacentChapters:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/RelatedChapter'
        quiz:
          oneOf:
            - $ref: '#/components/schemas/ChapterQuiz'
            - type: 'null'

    QuizQuestion:
      type: object
      additionalProperties: false
      required: [questionId, prompt, options, answerIndex, explanation]
      properties:
        questionId:
          type: string
          pattern: '^q_[A-Za-z0-9._-]{1,40}$'
        prompt:
          type: string
          minLength: 1
          maxLength: 300
        options:
          type: array
          minItems: 2
          maxItems: 6
          items:
            type: string
            minLength: 1
            maxLength: 200
        answerIndex:
          type: integer
          minimum: 0
          maximum: 5
        explanation:
          type: string
          minLength: 1
          maxLength: 500

    ChapterQuiz:
      type: object
      additionalProperties: false
      required: [version, publishedAt, questions]
      properties:
        version:
          type: integer
          minimum: 1
        publishedAt:
          type: integer
        questions:
          type: array
          minItems: 3
          maxItems: 5
          items:
            $ref: '#/components/schemas/QuizQuestion'

    RelatedChapter:
      type: object
      additionalProperties: false
      required: [chapterId, title]
      properties:
        chapterId:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200

    KnowledgePointDetail:
      type: object
      additionalProperties: false
      required: [knowledgePointId, courseId, chapterId, title, adjacentKnowledgePoints]
      properties:
        knowledgePointId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        chapterId:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        segmentId:
          type: string
          pattern: '^seg-[A-Za-z0-9._-]+$'
          maxLength: 80
        adjacentKnowledgePoints:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/RelatedKnowledgePoint'

    ProgressUpdate:
      type: object
      additionalProperties: false
      required: [watchedSec, completed]
      properties:
        watchedSec:
          type: integer
          minimum: 0
          maximum: 86400
        completed:
          type: boolean

    ProgressResult:
      type: object
      additionalProperties: false
      required: [knowledgePointId, watchedSec, completed, updatedAt]
      properties:
        knowledgePointId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        watchedSec:
          type: integer
          minimum: 0
          maximum: 86400
        completed:
          type: boolean
        updatedAt:
          type: integer
          description: 毫秒时间戳

    UserRole:
      type: string
      enum: [student, operator, admin, producer]
      description: producer 为生产端专用角色（M3b）：可写内容生产命名空间，不可发布、不可审批、不可管理账号与模型配置。
    UserStatus:
      type: string
      enum: [active, disabled]
    AdminUser:
      type: object
      additionalProperties: false
      required: [userId, displayName, role, status, createdAt]
      properties:
        userId:
          type: string
        username:
          type: string
          nullable: true
          description: 历史设备自动创建账号可能为空；M3 起账号均由管理员创建。
        displayName:
          type: string
          nullable: true
          maxLength: 200
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        deviceCount:
          type: integer
          minimum: 0
        createdAt:
          type: integer
          description: 毫秒时间戳
        lastActiveAt:
          type: integer
          nullable: true
          description: 最近设备活跃时间（毫秒时间戳）
    SessionUser:
      type: object
      additionalProperties: false
      required: [userId, username, displayName, role]
      properties:
        userId:
          type: string
        username:
          type: string
        displayName:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
    SessionResponse:
      type: object
      additionalProperties: false
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
        expiresAt:
          type: integer
          description: 毫秒时间戳
        user:
          $ref: '#/components/schemas/SessionUser'
    UserListResponse:
      type: object
      additionalProperties: false
      required: [users, total, offset, limit]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        total:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
    InviteRedeemRequest:
      type: object
      additionalProperties: false
      required: [inviteCode, password]
      properties:
        inviteCode:
          type: string
          maxLength: 32
        password:
          type: string
          minLength: 10
          maxLength: 128
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, role]
      properties:
        username:
          type: string
          pattern: '^[a-z][a-z0-9._-]{2,31}$'
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: '#/components/schemas/UserRole'
        password:
          type: string
          minLength: 10
          maxLength: 128
    CreateUserResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/AdminUser'
        inviteCode:
          type: string
          description: 仅在未提供初始密码时返回一次。
        inviteExpiresAt:
          type: integer
          description: 邀请码过期时间（毫秒时间戳）
    PatchUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
    ResetUserRequest:
      type: object
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 10
          maxLength: 128
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 128
        newPassword:
          type: string
          minLength: 10
          maxLength: 128

    ContentStatus:
      type: string
      enum: [draft, published, archived]

    AdminCourse:
      type: object
      additionalProperties: false
      required: [courseId, title, status]
      properties:
        courseId:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        title:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/ContentStatus'

    AdminCourseSummary:
      type: object
      additionalProperties: false
      required:
        [courseId, title, status, chapterCount, knowledgePointCount, segmentCount,
         chapterArticleCount, figureCount]
      properties:
        courseId:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/ContentStatus'
        chapterCount:
          type: integer
          minimum: 0
        knowledgePointCount:
          type: integer
          minimum: 0
        segmentCount:
          type: integer
          minimum: 0
        chapterArticleCount:
          type: integer
          minimum: 0
        figureCount:
          type: integer
          minimum: 0

    AdminArticleMeta:
      type: object
      additionalProperties: false
      required: [version, status]
      properties:
        version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ContentStatus'
        publishedAt:
          type: [integer, 'null']

    AdminArticle:
      type: object
      additionalProperties: false
      required: [markdown, version, status]
      properties:
        markdown:
          type: string
          minLength: 1
          maxLength: 20000
        version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ContentStatus'
        publishedAt:
          type: [integer, 'null']

    AdminQuiz:
      type: object
      additionalProperties: false
      required: [questions, version, status, publishedAt]
      properties:
        questions:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/QuizQuestion'
        version:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/ContentStatus'
        publishedAt:
          type: [integer, 'null']

    AdminKnowledgePoint:
      type: object
      additionalProperties: false
      required: [knowledgePointId, title, position, segmentCount]
      properties:
        knowledgePointId:
          type: string
        title:
          type: string
        position:
          type: integer
        segmentCount:
          type: integer
          minimum: 0

    AdminChapter:
      type: object
      additionalProperties: false
      required: [chapterId, title, position]
      properties:
        chapterId:
          type: string
        title:
          type: string
        position:
          type: integer

    AdminChapterTree:
      type: object
      additionalProperties: false
      required: [chapterId, title, position, article, figureCount, knowledgePoints]
      properties:
        chapterId:
          type: string
        title:
          type: string
        position:
          type: integer
        article:
          oneOf:
            - $ref: '#/components/schemas/AdminArticleMeta'
            - type: 'null'
        figureCount:
          type: integer
          minimum: 0
        knowledgePoints:
          type: array
          items:
            $ref: '#/components/schemas/AdminKnowledgePoint'

    AdminCourseTree:
      type: object
      additionalProperties: false
      required: [course, chapters]
      properties:
        course:
          $ref: '#/components/schemas/AdminCourse'
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/AdminChapterTree'

    AdminSegment:
      type: object
      additionalProperties: false
      required:
        [segmentId, courseId, chapterId, knowledgePointId, title, startSec, endSec, text, status, hasEmbedding]
      properties:
