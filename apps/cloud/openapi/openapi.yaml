  /v1/admin/content/provenance:
    post:
      summary: 生产溯源上报（operator/admin/producer，M9）
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskKey, model, status]
              additionalProperties: false
              properties:
                taskKey:
                  type: string
                  enum: [vision.describe, content.chunk_summary, content.concept_map, content.curriculum, content.section_draft, content.section_edit, content.figure_spec, content.widget_spec, content.rubric_review]
                model:
                  type: string
                  maxLength: 200
                provider:
                  type: string
                  maxLength: 32
                inputTokens:
                  type: integer
                  minimum: 0
                outputTokens:
                  type: integer
                  minimum: 0
                cachedTokens:
                  type: integer
                  minimum: 0
                latencyMs:
                  type: integer
                  minimum: 0
                status:
                  type: string
                  enum: [success, error]
                errorCode:
                  type: string
                  maxLength: 64
                skillVersions:
                  type: object
                  additionalProperties:
                    type: string
                    maxLength: 200
                targetId:
                  type: string
                  maxLength: 200
                summary:
                  type: object
                  description: 产物级结构化摘要（如评审评分与 verdict），落 ai_runs.summary；序列化后 ≤8KB
                  additionalProperties: true
      responses:
        '202':
          description: 写入 ai_runs(source='producer') 与用量账本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvenanceAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
