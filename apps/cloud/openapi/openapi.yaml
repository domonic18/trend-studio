            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: 请求体或音频超过上限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: 不支持的请求内容类型
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: 未识别到语音
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: 上游协议异常
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 上游不可用或未配置
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:
  /health:
    get:
      summary: 健康检查（含数据库连通性）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        '503':
          description: 数据库不可用
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean

  /v1/auth/device/code:
    post:
      summary: 发起设备码授权
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientId, deviceId]
              properties:
                clientId:
                  const: dsh-plugin-trend-coach
                deviceId:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '200':
          description: 设备码已签发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCodeStart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/auth/device/token:
    post:
      summary: 轮询设备码状态
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deviceCode]
              properties:
                deviceCode:
                  type: string
      responses:
        '200':
          description: 待批准 / 已过期 / 已授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/auth/refresh:
    post:
      summary: 轮换 access/refresh 令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken, deviceId]
              properties:
                refreshToken:
                  type: string
                deviceId:
                  type: string
      responses:
        '200':
          description: 新 grant；旧 refresh 立即失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/auth/revoke:
    post:
      summary: 注销当前设备并吊销其令牌
      description: 吊销该设备全部 access/refresh 并置为 revoked；重新设备授权可恢复，不影响同账号其它设备。
      security:
        - bearerAuth: []
          deviceId: []
      responses:
        '200':
          description: 已注销
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/auth/device/approve:
    post:
      summary: 批准设备码并绑定账号
      description: |
        学员：提交 `userCode` + `username`/`password`，或 `userCode` + `inviteCode` + 新 `password`。
        运营/管理员：带后台会话 Bearer，提交 `userCode` 与可选 `userId` 代批。
        不再接受共享控制台令牌；设备批准后绑定固定账号。
      security:
        - sessionAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userCode]
              properties:
                userCode:
                  type: string
                  pattern: '^[A-Z0-9]{4}-[A-Z0-9]{4}$'
                username:
                  type: string
                  pattern: '^[a-z][a-z0-9._-]{2,31}$'
                password:
                  type: string
                  minLength: 10
                  maxLength: 128
                inviteCode:
                  type: string
                  maxLength: 32
                userId:
                  type: string
                  maxLength: 64
                  description: 仅后台会话代批时可用。
      responses:
        '200':
          description: 已批准
          content:
            application/json:
              schema:
                type: object
                required: [approved]
                properties:
                  approved:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/kb/search:
    post:
      summary: Top-K 片段检索
      security:
        - bearerAuth: []
          deviceId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query:
                  type: string
                  description: 去首尾空白后 1–500 字符
                topK:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 5
                courseId:
                  type: string
                  pattern: '^[A-Za-z0-9._-]{1,64}$'
      responses:
        '200':
          description: 检索结果；空召回时给 relatedKnowledgePoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/kb/segments/{segmentId}:
    get:
      summary: 片段详情（权威起止秒）
      security:
        - bearerAuth: []
          deviceId: []
      parameters:
        - name: segmentId
          in: path
          required: true
          schema:
            type: string
            pattern: '^seg-[A-Za-z0-9._-]+$'
            maxLength: 80
      responses:
        '200':
          description: 片段元数据，score 恒为 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Segment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/catalog/courses:
    get:
      summary: 已发布课程列表
      security:
        - bearerAuth: []
          deviceId: []
      responses:
        '200':
          description: 课程列表，含当前用户完成数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCourseList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/catalog/courses/{courseId}:
    get:
      summary: 课程树（章节与知识点）
      description: 只返回已发布课程；知识点不携带起止秒，播放定位仍以片段详情为准。
      security:
        - bearerAuth: []
          deviceId: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9._-]{1,64}$'
      responses:
        '200':
          description: 课程树，知识点内联当前用户进度
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCourse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/catalog/courses/{courseId}/chapters/{chapterId}:
    get:
      summary: 章节教材与图示
      description: '只返回已发布章节教材；正文中的 figure: 引用由插件按 figures 映射替换为短时签名地址。'
      security:
        - bearerAuth: []
          deviceId: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9._-]{1,64}$'
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9._-]{1,64}$'
      responses:
        '200':
          description: 章节教材；未发布时 article 为 null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogChapterArticle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/catalog/courses/{courseId}/quotes:
    get:
      summary: 课程案例股行情（学员端）
      description: 只返回该课程已发布案例股清单内的行情；清单外代号被过滤。尚未同步时返回 pending=true 与空数组。
      security:
        - bearerAuth: []
          deviceId: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9._-]{1,64}$'
        - name: codes
          in: query
          required: false
          description: 逗号分隔的 6 位代号，最多 10 只；缺省为课程全部已发布案例股
          schema:
            type: string
            maxLength: 69
        - name: from
          in: query
          required: false
          description: 起始交易日（含），YYYY-MM-DD
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: to
          in: query
          required: false
          description: 结束交易日（含），YYYY-MM-DD
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: 行情序列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotesListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/catalog/courses/{courseId}/sections/{sectionId}:
    get:
      summary: 节级学习契约（正文 + 课件 + 图示 + 案例股）
      description: 只返回已发布课程已发布节的内容；图示带短时签名地址。
      security:
        - bearerAuth: []
          deviceId: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9._-]{1,64}$'
        - name: sectionId
          in: path
          required: true
          schema:
            type: string
            pattern: '^sec_[0-9a-f]{16}$'
      responses:
        '200':
          description: 节详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/catalog/sections/{sectionId}/playback:
    post:
      summary: 学员播放会话（节内 clip 窗）
      description: 请求窗必须完整落在该节已发布正文的某个 clip 块窗内，否则 409 playback_window_invalid。
      security:
        - bearerAuth: []
          deviceId: []
      parameters:
        - name: sectionId
          in: path
          required: true
          schema:
            type: string
            pattern: '^sec_[0-9a-f]{16}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assetId, fromSec, toSec]
              properties:
                assetId:
                  type: string
                  pattern: '^asset_[0-9a-f]{16}$'
                fromSec:
                  type: integer
                  minimum: 0
                  maximum: 86400
                toSec:
                  type: integer
                  minimum: 1
                  maximum: 86400
      responses:
        '200':
          description: 播放会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPlayback'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/catalog/knowledge-points/{knowledgePointId}:
    get:
      summary: 知识点详情与相邻知识点
      security:
        - bearerAuth: []
          deviceId: []
      parameters:
        - name: knowledgePointId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9._-]{1,64}$'
      responses:
        '200':
          description: 知识点详情；M8 起不再返回文章，正文由章节接口提供
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePointDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/progress/knowledge-points/{knowledgePointId}:
    put:
      summary: 上报学习进度
      description: 幂等；观看时长取历史最大值，完成状态不可回退，不受指标同意开关影响。
      security:
        - bearerAuth: []
          deviceId: []
      parameters:
        - name: knowledgePointId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9._-]{1,64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressUpdate'
      responses:
        '200':
          description: 合并后的进度
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/playback/sessions:
    post:
      summary: 换取短时效签名播放会话
      security:
        - bearerAuth: []
          deviceId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [segmentId]
              properties:
                segmentId:
                  type: string
      responses:
        '200':
          description: 签名 playlistUrl；浏览器不持 Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: 媒体资源不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/events/consent:
    get:
      summary: 读取指标上报同意状态
      description: 默认未同意；插件只在该用户明确同意后上报白名单事件。
      security:
        - bearerAuth: []
          deviceId: []
      responses:
        '200':
          description: 当前同意状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsConsent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      summary: 修改指标上报同意状态
      description: 撤销后立即停止接收事件；已上报数据不回溯删除。
      security:
        - bearerAuth: []
          deviceId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [consent]
              properties:
                consent:
                  type: boolean
      responses:
        '200':
          description: 修改后的同意状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsConsent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/events:
    post:
      summary: 接收白名单指标事件
      description: 需要用户同意；按 eventId 幂等。不接收 query 原文、回答内容或播放地址。
      security:
        - bearerAuth: []
          deviceId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '202':
          description: 已接收（重复 eventId 同样返回 202）
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 未同意上报
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/asr/transcribe:
    post:
      summary: 语音转写（MiniMax ASR）
      description: 音频仅在内存中转发给上游，不落盘、不落日志；文本清洗后返回，空结果 422。请求体上限 3MiB。
      security:
        - bearerAuth: []
          deviceId: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsrRequest'
      responses:
        '200':
          description: 转写成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsrResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/auth/invite/redeem:
    post:
      summary: 一次性邀请码设置密码
      description: 邀请码单次有效；成功后账号可用用户名密码登录。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRedeemRequest'
      responses:
        '200':
          description: 已兑换
          content:
            application/json:
              schema:
                type: object
                required: [redeemed]
                properties:
                  redeemed:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 邀请码无效、过期或已使用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/auth/session:
    post:
      summary: 后台登录（operator/admin）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username:
                  type: string
                  pattern: '^[a-z][a-z0-9._-]{2,31}$'
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 用户名或密码错误、账号禁用或未激活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 学员账号不可登录后台
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      summary: 读取当前后台会话
      security:
        - sessionAuth: []
      responses:
        '200':
          description: 当前账号
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/SessionUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      summary: 注销当前后台会话
      security:
        - sessionAuth: []
      responses:
        '200':
          description: 已注销
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/session/password:
    post:
      summary: 自助修改后台密码
